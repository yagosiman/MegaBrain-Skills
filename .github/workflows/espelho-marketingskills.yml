# Toda segunda, confere se a skill `ads` ou a `ad-creative` mudou no
# marketingskills. Se mudou, roda o espelho e abre um PR com a diferença: nada
# entra no main sem revisão, e a versão anterior fica no histórico do Git. O
# autor publica várias vezes por semana em outras skills; o espelho só regrava a
# origem quando o texto das nossas duas muda.
#
# Precisa, nas configurações do repositório: Settings → Actions → General →
# "Allow GitHub Actions to create and approve pull requests".

name: Espelho do marketingskills

on:
  schedule:
    - cron: "45 11 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  espelhar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Espelhar o main do marketingskills
        id: espelho
        run: |
          node scripts/espelhar-marketingskills.mjs
          commit=$(node -p 'require("fs").readFileSync("plugins/skills/origens/marketingskills/UPSTREAM.md","utf8").match(/Commit: `([0-9a-f]{7})/)[1]')
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if [ -z "$(git status --porcelain plugins/skills)" ]; then echo "mudou=nao" >> "$GITHUB_OUTPUT"; else echo "mudou=sim" >> "$GITHUB_OUTPUT"; fi

      - name: Abrir PR
        if: steps.espelho.outputs.mudou == 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.espelho.outputs.commit }}
        run: |
          ramo="espelho/marketingskills-$COMMIT"
          if git ls-remote --exit-code --heads origin "$ramo" > /dev/null; then
            echo "Já existe PR aberto pra $COMMIT."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$ramo"
          git add -A plugins/skills
          git commit -m "marketingskills: espelho do coreyhaines31/marketingskills@$COMMIT"
          git push origin "$ramo"
          gh pr create --title "marketingskills @ $COMMIT" \
            --body "A skill ads ou a ad-creative mudou no marketingskills. Revise o diff antes de aceitar: o que entrar aqui chega no Claude de quem instalou o plugin."
